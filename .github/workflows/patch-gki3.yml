name: Patch GKI root setup
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Patch root-setup action
        shell: bash
        env:
          B64: 
        run: |
          echo "$B64" | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          git config user.name "Xiexiufyx"
          git config user.email "1054534375@qq.com"
          git add -A
          git commit -m "patch root-setup selinux_hide static"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Xiexiufyx/GKI_KernelSU_SUSFS.git" HEAD:main
